name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux audio library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 pulseaudio
          pulseaudio -D --exit-idle-time=-1 || true
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python modules
        run: python -m compileall -q gateway client tests
      - name: Import application modules
        run: python -c "import client.webrtc_client, gateway.main"
      - name: Check shell scripts
        if: runner.os != 'Windows'
        run: bash -n scripts/setup_env.sh scripts/run_gateway.sh scripts/run_client.sh
      - name: Smoke-test shell launchers
        if: runner.os != 'Windows'
        run: |
          bash scripts/run_gateway.sh --help
          bash scripts/run_client.sh --help
